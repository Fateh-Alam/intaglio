[package]
name = "etch-desktop"
version = "0.1.0"
description = "Etch for macOS: the desktop shell around the Etch editor"
edition = "2021"
publish = false

[lib]
name = "etch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
