[package]
name = "etch-core"
version = "0.1.0"
description = "Etch's native image engine: the edit pipeline on wgpu (Metal on macOS, WebGPU on the web)"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
moxcms = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
wgpu = "30.0.2"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.3"
serde_json = "1.0.154"
